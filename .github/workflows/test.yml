name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (locked, 3.10 reference env)
      if: matrix.python-version == '3.10'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt

    - name: Install dependencies (ranged, newer Pythons)
      if: matrix.python-version != '3.10'
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Install package and tools
      run: |
        pip install -e .
        pip install pytest-cov ruff

    - name: Lint
      run: ruff check src/ tests/ tools/

    - name: Run test suite with coverage
      run: |
        PYTHONPATH=src python -m pytest tests/ -v --tb=short --cov=lidar_snow_filter --cov-report=term

    - name: Run synthetic data generation
      run: |
        PYTHONPATH=src python -m lidar_snow_filter.synthetic_data_generator --num_scans 2 --seed 42 --contaminate

    - name: Run demo (renders comparison figure)
      run: |
        PYTHONPATH=src python tools/demo.py --out /tmp/demo.png

    - name: Verify reproducibility (determinism test)
      run: |
        PYTHONPATH=src python tests/test_reproducibility.py
