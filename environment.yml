name: lidar-snow-filtering
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10

  # Core Data Science
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0

  # 3D Point Cloud Processing
  - open3d::open3d=0.17.0

  # Visualization
  - matplotlib>=3.4.0

  # Development Tools
  - git
  - pytest

  # pip packages (if not available in conda)
  - pip

# Usage:
# conda env create -f environment.yml
# conda activate lidar-snow-filtering
